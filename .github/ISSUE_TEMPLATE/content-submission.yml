name: ✍️ 内容投稿
description: 投稿博客文章 / 教程等新内容（仅粘贴 Markdown 正文，frontmatter 自动生成）
title: "[投稿]: "
labels: ["content", "待处理"]
body:
  - type: markdown
    attributes:
      value: |
        ## 投稿须知 📜

        投稿即代表您已阅读并同意以下条款：

        1. 投稿内容若非原创，需确保已获得原作者授权。
        2. 审核通过的文章将以**署名 + MIT 协议**发布。
        3. 维护者有权对内容做排版、删改与归类。
        4. 请勿提交违反国家法律法规或社区准则的内容。

        ---

        请在下方**勾选所有声明**，并填写投稿信息。未勾选者将被自动关闭。

  - type: checkboxes
    id: declaration
    attributes:
      label: 授权与原创声明
      description: 全部勾选后才能提交
      options:
        - label: 本文为本人原创 / 已获得原作者授权转载
          required: true
        - label: 同意以 MIT 协议发布
          required: true
        - label: 内容符合国家法律法规
          required: true

  - type: input
    id: author
    attributes:
      label: 作者署名
      placeholder: "hjxxxx"
    validations:
      required: true

  - type: input
    id: title
    attributes:
      label: 文章标题
      placeholder: "从零搭建 Hexo 博客"
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: 文章分类
      options:
        - "tech"
        - "essay"
        - "tutorial"
        - "life"
        - "event"
        - "其他"
    validations:
      required: true

  - type: textarea
    id: content
    attributes:
      label: Markdown 正文
      description: 直接粘贴 .md 内容，不要含 frontmatter（标题 / 分类 / 署名会自动写入）
      placeholder: |
        ## 概述
        正文...
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 附加说明（可选）
      description: 转载来源、特殊要求等
