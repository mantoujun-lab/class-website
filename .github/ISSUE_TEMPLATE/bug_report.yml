name: "🐛 Bug 反馈"
description: "描述需要修复的bug"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你反馈问题 🐛 描述越详细, 我们越容易复现和修复.

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 简要说明出现了什么问题.
      placeholder: "在 xxx 页面做 xxx 操作时, 出现了 xxx..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 给出可重现该问题的最小步骤.
      placeholder: |
        1. 进入页面 '...'
        2. 点击 '...'
        3. 看到 '...'
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你原本期望发生什么?
      placeholder: "应该 ..."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际上发生了什么?
      placeholder: "结果 ..."
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 截图 / 日志
      description: 如有截图或控制台报错, 请贴出来帮助诊断.
      placeholder: "(可选) 拖拽图片到此处即可上传"
    validations:
      required: false

  - type: input
    id: url
    attributes:
      label: 出现页面 URL
      description: 出现问题的页面地址 (如部署站或本地预览地址).
      placeholder: "https://class-website.vercel.app/..."
    validations:
      required: false

  - type: dropdown
    id: browser
    attributes:
      label: 浏览器
      multiple: true
      options:
        - Chrome
        - Edge
        - Firefox
        - Safari
        - 其他 (在 "其他信息" 里注明)
    validations:
      required: true

  - type: dropdown
    id: device
    attributes:
      label: 设备类型
      multiple: true
      options:
        - 桌面端 (Windows)
        - 桌面端 (macOS)
        - 桌面端 (Linux)
        - 手机 (Android)
        - 手机 (iOS)
        - 平板
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 操作系统 / 版本
      placeholder: "Windows 11, iOS 17..."
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: 其他信息
      description: 任何有助于定位问题的额外内容.
      placeholder: "(可选)"
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: 确认事项
      options:
        - label: 我已搜索过现有的 issues, 没有重复反馈.
          required: true
