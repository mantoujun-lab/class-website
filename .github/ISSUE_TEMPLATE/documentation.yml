name: 📝 文档改进
description: 修正或完善项目文档（README、Wiki、教程、注释等）
title: "[Docs]: "
labels: ["docs"]
body:
  - type: markdown
    attributes:
      value: |
        ## 感谢你为文档添砖加瓦 📚
        清晰的文档直接影响他人上手体验。请尽量提供修改前后的对比，方便评审。

  - type: dropdown
    id: doc-type
    attributes:
      label: 文档类型
      description: 选择要改进的文档类别
      options:
        - "README.md"
        - "docs/README_zh-cn.md"
        - "Wiki / 在线文档"
        - "教程 / Blog 文章 (/src/posts)"
        - "代码注释 / JSDoc"
        - "其他"
    validations:
      required: true

  - type: textarea
    id: location
    attributes:
      label: 涉及位置
      description: 标明文件路径或 URL，便于定位
      placeholder: |
        - 路径: docs/README_zh-cn.md
        - 行号: 23 ~ 45
        - 在线链接: https://your-domain.vercel.app/xxx
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 当前问题
      description: 描述现有文档哪里不清楚、错误或缺失
      placeholder: "例如：安装步骤遗漏了 Node.js 24 的版本要求，新手按文档操作会失败。"
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: 改进建议
      description: 你的修改建议或对比方案；可以直接粘贴草稿
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: 截图 / 参考材料
      description: 粘贴截图、对比图或附加说明
