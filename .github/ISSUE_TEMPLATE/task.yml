name: 📋 任务 / 待办
description: 项目内部任务拆解与跟踪（仅项目成员使用）
title: "[Task]: "
labels: ["task", "待处理"]
body:
  - type: markdown
    attributes:
      value: |
        ## ⚠️ 仅项目成员使用
        本模板用于**内部任务拆解与跟踪**，对外贡献请使用 🐛 Bug 报告或 🚀 功能请求。

  - type: textarea
    id: background
    attributes:
      label: 背景与目标
      description: 简要描述任务背景，要达成什么目标，以及为什么现在要做
      placeholder: "例：博客首页 LCP 偏高，影响移动端体验。目标：把 LCP 降至 2.0s 以内。"
    validations:
      required: true

  - type: textarea
    id: ac
    attributes:
      label: 验收标准 (Acceptance Criteria)
      description: 用 checklist 列出「完成定义」，便于开发与验收对齐
      placeholder: |
        - [ ] 首页 Lighthouse Performance 分数 ≥ 90
        - [ ] 移动端 (Moto G4) LCP ≤ 2.0s
        - [ ] 新增/修改的指标写入 README 的「性能基线」段落
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      description: 选择任务优先级，便于排期
      options:
        - "P0 - 紧急：阻塞上线或故障，立即处理"
        - "P1 - 高：本迭代内完成"
        - "P2 - 中：下一迭代规划"
        - "P3 - 低：有空再做 / Backlog"
    validations:
      required: true

  - type: dropdown
    id: size
    attributes:
      label: 工作量预估
      description: 估算工期，方便评估是否需要拆分
      options:
        - "XS (< 0.5 人天)"
        - "S (0.5 ~ 1 人天)"
        - "M (1 ~ 3 人天)"
        - "L (3 ~ 5 人天)"
        - "XL (> 5 人天，需要拆分)"
    validations:
      required: true

  - type: input
    id: milestone
    attributes:
      label: 关联 Milestone
      description: 填写要关联的 Milestone 编号或名称（可选，留空表示未规划）
      placeholder: "v1.3.0"

  - type: textarea
    id: subtasks
    attributes:
      label: 子任务拆解
      description: 把任务拆成可独立提交的小步骤，每完成一项打勾
      placeholder: |
        - [ ] 复现问题并产出基线数据
        - [ ] 方案设计 / PR 草案
        - [ ] 实施 + 单元测试
        - [ ] 文档 / README 同步
        - [ ] Code Review 通过

  - type: textarea
    id: deps
    attributes:
      label: 依赖与风险
      description: 列出前置依赖、潜在风险或影响面（可选）

  - type: textarea
    id: context
    attributes:
      label: 附加上下文
      description: 设计稿链接、相关 Issue / Discussion、参考资料等
