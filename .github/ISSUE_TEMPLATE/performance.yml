name: ⚡ 性能问题
description: 反馈网站加载慢、Lighthouse 分数下降或运行时卡顿
title: "[Perf]: "
labels: ["perf"]
body:
  - type: markdown
    attributes:
      value: |
        ## 性能问题反馈 🏎️
        建议先用 Lighthouse / WebPageTest 自测一次，贴出数据更有说服力。
        工具入口：Chrome DevTools → Lighthouse 面板；https://pagespeed.web.dev/

  - type: textarea
    id: symptom
    attributes:
      label: 性能症状
      description: 描述现象：哪个页面、哪个指标差、影响什么场景
      placeholder: "首页在 4G 网络下 LCP 偏高，移动端尤其明显。"
    validations:
      required: true

  - type: dropdown
    id: page
    attributes:
      label: 受影响页面
      description: 选择问题最显著的页面
      options:
        - "首页 /"
        - "文章详情页 /posts/*"
        - "标签页 /tags/*"
        - "归档页 /archives/"
        - "关于页 /about/"
        - "全站普遍"
        - "其他"
    validations:
      required: true

  - type: textarea
    id: metrics
    attributes:
      label: 实测指标（可选）
      description: 贴出 Lighthouse / WebPageTest / DevTools Performance 面板的关键指标；没有专业设备可不填，只描述主观感受也可以
      placeholder: |
        - LCP: 4.2s
        - FCP: 2.8s
        - TBT: 850ms
        - CLS: 0.18
        - Lighthouse 性能分: 58

  - type: textarea
    id: environment
    attributes:
      label: 测试环境（可选）
      description: 设备型号、网络状况、浏览器版本、地区；能填多少填多少，没专业设备只需大致说明
      placeholder: |
        - 设备: Pixel 5 (模拟)
        - 网络: Slow 4G
        - 浏览器: Chrome 126
        - 地区: 杭州

  - type: textarea
    id: expected
    attributes:
      label: 期望指标
      description: 你认为合理的目标值或优化方向
      placeholder: "希望移动端 LCP 能降到 2.0s 以内，Lighthouse 性能分 ≥ 90。"

  - type: textarea
    id: guess
    attributes:
      label: 猜想根因
      description: 可选：你猜测的原因（图片未压缩、第三方脚本阻塞、CSS 体积过大 ...）

  - type: textarea
    id: context
    attributes:
      label: 附加上下文
      description: Lighthouse 报告链接、对比基线、复现录屏等
