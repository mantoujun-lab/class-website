# Dependabot 配置：自动检查依赖更新并创建 PR
# 文档：https://docs.github.com/zh/code-security/dependabot

version: 2

# 全局开关
# 每个 update 项下允许的子属性参考：
# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
updates:
  # —— GitHub Actions ——
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Shanghai"
    # Actions 升级兼容性较好，patch + minor 自动合并
    labels:
      - "dependencies"
      - "ci"
    # 每个 PR 只跑 5 个，避免堆积
    open-pull-requests-limit: 5
    # Group 一起提 PR，减少噪音
    groups:
      actions-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # —— npm ——
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Shanghai"
    # dev 依赖较多，PR 上限放开一些
    open-pull-requests-limit: 8
    labels:
      - "dependencies"
      - "javascript"
    # 各组策略：把同类型更新合并到一个 PR 里
    groups:
      # Eleventy 主框架及其插件（重大升级需手工确认）
      eleventy-major:
        patterns:
          - "@11ty/*"
        update-types:
          - "major"
      eleventy-minor:
        patterns:
          - "@11ty/*"
        update-types:
          - "minor"
          - "patch"
      # 构建工具链（Sass / PostCSS / Autoprefixer）
      build-tools:
        patterns:
          - "sass"
          - "postcss"
          - "autoprefixer"
        update-types:
          - "minor"
          - "patch"
      # 其它依赖
      prod-minor:
        update-types:
          - "minor"
          - "patch"
    # 允许范围：
    #   - 生产依赖：仅 patch / minor（升级 major 风险较大）
    #   - 开发依赖：完全放开，包括 major（dev 工具断了影响小）
    allow:
      - dependency-type: "development"
      # production 不显式 allow，则按默认 major 不自动开 PR
    # 不主动忽略的依赖
    ignore: []

# 如果你想让某些依赖完全不更新，可以在上面某个 updates 块里加 ignore：
# ignore:
#   - dependency-name: "autoprefixer"
#     versions: ["10.x"]
