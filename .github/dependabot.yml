# Dependabot 配置：自动检查依赖更新并创建 PR
# 文档：https://docs.github.com/zh/code-security/dependabot

version: 2

updates:
  # —— GitHub Actions ——
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Shanghai"
    labels:
      - "dependencies"
      - "ci"
    open-pull-requests-limit: 5
    groups:
      actions-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # —— npm ——
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 8
    labels:
      - "dependencies"
      - "javascript"
    # 版本更新策略说明：
    #   - 不使用 allow 配置限制依赖类型，确保生产依赖和安全更新都能被检测到
    #     （原配置错误地只allow development，导致生产依赖安全告警无法自修复）
    #   - 通过 groups 精细控制更新分组：major更新单独PR需人工审核，minor/patch自动分组
    #   - 安全更新(Security updates)不受groups影响，总是单独创建PR优先处理
    groups:
      # 所有依赖的 major 版本更新单独分组，必须人工审查兼容性
      all-major:
        patterns:
          - "*"
        update-types:
          - "major"
      # Eleventy 生态 minor/patch 更新
      eleventy-minor:
        patterns:
          - "@11ty/*"
        update-types:
          - "minor"
          - "patch"
      # 构建工具链 minor/patch 更新
      build-tools-minor:
        patterns:
          - "sass"
          - "postcss"
          - "autoprefixer"
        update-types:
          - "minor"
          - "patch"
      # 其他依赖 minor/patch 更新
      all-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "@11ty/*"
          - "sass"
          - "postcss"
          - "autoprefixer"
    ignore: []
