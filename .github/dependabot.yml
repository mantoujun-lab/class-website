# Dependabot 配置：自动检查依赖更新并创建 PR
# 文档：https://docs.github.com/zh/code-security/dependabot

version: 2

updates:
  # —— GitHub Actions ——
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Shanghai"
    labels:
      - "dependencies"
      - "ci"
    open-pull-requests-limit: 5
    groups:
      actions-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # —— npm ——
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 8
    labels:
      - "dependencies"
      - "javascript"
      - "security"
    # 版本更新策略：
    #   - 不使用 allow 限制依赖类型，确保生产依赖和安全更新都能被检测到
    #   - major更新单独PR需人工审核，minor/patch分组处理
    #   - 安全更新(Security updates)不受groups限制，总是单独创建PR
    #   - 对于 npm 生态的传递依赖(Transitive Dependencies)安全漏洞，
    #     Dependabot 天生无法直接创建 PR，需配合 package.json 中的 overrides 手动修复
    groups:
      # 所有 major 版本更新单独分组，必须人工审查兼容性
      major-updates:
        patterns:
          - "*"
        update-types:
          - "major"
      # non-major 更新（minor + patch）分组处理
      minor-patch-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
