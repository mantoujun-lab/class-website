name: Generate contributors

# 触发方式：
#   1. 手动触发：Actions 页面 → Run workflow
#   2. push 到 main 分支时自动运行
#   3. 每周日 03:00 UTC 定时运行
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 0'

permissions:
  contents: write

# 同一工作流同时只保留一个运行实例，避免并发提交互相覆盖
concurrency:
  group: contributors-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 完整克隆，避免脚本运行期间其他 push 导致 git push 时 non-fast-forward 失败
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # 串行执行两个操作：
      #   1. 运行 scripts/update-contributors-md.js，从 GitHub API 拉取贡献者
      #   2. 根据贡献者生成 CONTRIBUTORS.md，并更新 README/首页头像墙
      - name: Update CONTRIBUTORS.md and contributor walls
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/update-contributors-md.js

      - name: Commit and push
        # GITHUB_TOKEN 产生的 push 不会再次触发工作流，避免死循环
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CONTRIBUTORS.md README.md src/zh-cn/index.md src/en/index.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(contributors): update CONTRIBUTORS.md and contributor walls [skip ci]"
            git push origin HEAD:"${{ github.ref_name }}"
          fi
